services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    ports:
      - "3000:3000"
    environment:
      CACHE_MAX_GB: ${CACHE_MAX_GB:-2}
      MAX_DURATION_MIN: ${MAX_DURATION_MIN:-60}
      IDLE_PAUSE_MIN: ${IDLE_PAUSE_MIN:-5}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      SYNC_LOG: ${SYNC_LOG:-}
      # Cloudflare puts the visitor's real IP here, so each visitor keeps their own search limit behind the tunnel.
      CLIENT_IP_HEADER: cf-connecting-ip
    volumes:
      - ./data/app:/data
    restart: unless-stopped

  # Public https access. Runs only with COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN set in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
